name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - name: Secret demo
        env: 
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "Token is $DEMO_TOKEN"
          echo "Reversed is $(echo $DEMO_TOKEN | rev)"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-${{ matrix.node-version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7